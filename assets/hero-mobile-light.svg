<svg xmlns="http://www.w3.org/2000/svg" width="430" height="345" viewBox="0 0 430 345" role="img" aria-label="Shivam S. Pimple - Full-Stack Developer and AI Applications">
  <defs>
    <linearGradient id="hero-mbg-light" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>

    <linearGradient id="hero-mborder-light" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#4f46e5" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0.7"/>
    </linearGradient>

    <pattern id="hero-mgrid-light" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 H 0 V 24" fill="none" stroke="#0284c7" stroke-width="0.5" stroke-opacity="0.03"/>
    </pattern>

    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    </style>
  </defs>

  <!-- Card Background -->
  <rect x="1" y="1" width="428" height="343" rx="14" fill="url(#hero-mbg-light)" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="1" y="1" width="428" height="343" rx="14" fill="url(#hero-mgrid-light)"/>

  <!-- Top Decorative Accent Line -->
  <rect x="2" y="1" width="426" height="2" rx="1" fill="url(#hero-mborder-light)"/>

  <!-- Main Heading: Name -->
  <text x="20" y="44" class="sans" font-size="22" font-weight="700" fill="#0f172a" letter-spacing="-0.3">
    👋 Hi, I'm <tspan fill="#0284c7">Shivam S. Pimple</tspan>
  </text>

  <!-- Philosophy Quote Bar -->
  <g transform="translate(20, 60)">
    <rect x="0" y="0" width="390" height="44" rx="8" fill="rgba(248, 250, 252, 0.95)" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="0" y="0" width="4" height="44" rx="2" fill="#0284c7"/>
    <text x="14" y="20" class="sans" font-size="11.5" font-style="italic" font-weight="500" fill="#1e293b">
      “I believe every problem has a
    </text>
    <text x="14" y="34" class="sans" font-size="11.5" font-style="italic" font-weight="500" fill="#1e293b">
      solution worth working toward.”
    </text>
  </g>

  <!-- Capability Cards (3 Rows x 2 Columns) -->
  <!-- 1: Full-Stack MERN -->
  <g transform="translate(20, 116)">
    <rect x="0" y="0" width="190" height="64" rx="7" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <g transform="translate(10, 10)">
      <path d="M6 1L1 3.5l5 2.5 5-2.5L6 1zM1 7.5l5 2.5 5-2.5M1 5.5l5 2.5 5-2.5" fill="none" stroke="#0284c7" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="28" y="20" class="sans" font-size="11.5" font-weight="600" fill="#0f172a">Full-Stack MERN</text>
    <text x="10" y="36" class="sans" font-size="9.5" fill="#475569">Scalable web apps, APIs,</text>
    <text x="10" y="48" class="sans" font-size="9.5" fill="#475569">modular architecture.</text>
  </g>

  <!-- 2: Applied AI & GenAI -->
  <g transform="translate(220, 116)">
    <rect x="0" y="0" width="190" height="64" rx="7" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <g transform="translate(10, 10)">
      <rect x="2" y="2" width="8" height="8" rx="1.5" fill="none" stroke="#4f46e5" stroke-width="1.2"/>
      <path d="M4 4h4v4H4zM4 0v2M8 0v2M4 10v2M8 10v2M10 4h2M10 8h2M0 4h2M0 8h2" fill="none" stroke="#4f46e5" stroke-width="1.1" stroke-linecap="round"/>
    </g>
    <text x="28" y="20" class="sans" font-size="11.5" font-weight="600" fill="#0f172a">Applied AI &amp; GenAI</text>
    <text x="10" y="36" class="sans" font-size="9.5" fill="#475569">Practical AI workflows</text>
    <text x="10" y="48" class="sans" font-size="9.5" fill="#475569">in real-world web apps.</text>
  </g>

  <!-- 3: LLMs & RAG Pipelines (Neural Network / Connected Graph Icon) -->
  <g transform="translate(20, 188)">
    <rect x="0" y="0" width="190" height="64" rx="7" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <g transform="translate(10, 10)">
      <line x1="2" y1="3" x2="6" y2="6.5" stroke="#0284c7" stroke-width="0.9" stroke-opacity="0.75"/>
      <line x1="2" y1="10" x2="6" y2="6.5" stroke="#0284c7" stroke-width="0.9" stroke-opacity="0.75"/>
      <line x1="6" y1="6.5" x2="10" y2="3" stroke="#0284c7" stroke-width="0.9" stroke-opacity="0.75"/>
      <line x1="6" y1="6.5" x2="10" y2="10" stroke="#0284c7" stroke-width="0.9" stroke-opacity="0.75"/>
      <circle cx="2" cy="3" r="1.5" fill="#0284c7"/>
      <circle cx="2" cy="10" r="1.5" fill="#0284c7"/>
      <circle cx="6" cy="6.5" r="1.8" fill="#0284c7"/>
      <circle cx="10" cy="3" r="1.5" fill="#0284c7"/>
      <circle cx="10" cy="10" r="1.5" fill="#0284c7"/>
    </g>
    <text x="28" y="20" class="sans" font-size="11.5" font-weight="600" fill="#0f172a">LLMs &amp; RAG Pipelines</text>
    <text x="10" y="36" class="sans" font-size="9.5" fill="#475569">Vector search, retrieval,</text>
    <text x="10" y="48" class="sans" font-size="9.5" fill="#475569">and grounded context.</text>
  </g>

  <!-- 4: Analytical Persistence -->
  <g transform="translate(220, 188)">
    <rect x="0" y="0" width="190" height="64" rx="7" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <g transform="translate(10, 10)">
      <circle cx="6" cy="6" r="4.8" fill="none" stroke="#d97706" stroke-width="1.2"/>
      <circle cx="6" cy="6" r="2" fill="none" stroke="#d97706" stroke-width="1.1"/>
      <path d="M6 0v1.5M6 10.5v1.5M0 6h1.5M10.5 6h1.5" fill="none" stroke="#d97706" stroke-width="1.1" stroke-linecap="round"/>
    </g>
    <text x="28" y="20" class="sans" font-size="11.5" font-weight="600" fill="#0f172a">Analytical Persistence</text>
    <text x="10" y="36" class="sans" font-size="9.5" fill="#475569">Root-cause analysis &amp;</text>
    <text x="10" y="48" class="sans" font-size="9.5" fill="#475569">disciplined debugging.</text>
  </g>

  <!-- 5: Production Software -->
  <g transform="translate(20, 260)">
    <rect x="0" y="0" width="190" height="64" rx="7" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <g transform="translate(10, 10)">
      <path d="M6 1.2L1.5 3.7v5l4.5 2.5 4.5-2.5v-5L6 1.2z" fill="none" stroke="#e11d48" stroke-width="1.2" stroke-linejoin="round"/>
      <path d="M6 6.2l4.5-2.5M6 6.2v5M6 6.2L1.5 3.7" fill="none" stroke="#e11d48" stroke-width="1.1" stroke-linecap="round"/>
    </g>
    <text x="28" y="20" class="sans" font-size="11.5" font-weight="600" fill="#0f172a">Production Software</text>
    <text x="10" y="36" class="sans" font-size="9.5" fill="#475569">Reliable, maintainable</text>
    <text x="10" y="48" class="sans" font-size="9.5" fill="#475569">real-world systems.</text>
  </g>

  <!-- 6: Continuous Growth (Trending-up / Growth Chart Icon) -->
  <g transform="translate(220, 260)">
    <rect x="0" y="0" width="190" height="64" rx="7" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <g transform="translate(10, 10)">
      <path d="M1 11h10" fill="none" stroke="#059669" stroke-width="0.9" stroke-linecap="round" stroke-opacity="0.5"/>
      <polyline points="1.5 9, 4.5 6.5, 7 8, 10.5 2.5" fill="none" stroke="#059669" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
      <polyline points="8 2.5, 10.5 2.5, 10.5 5" fill="none" stroke="#059669" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="28" y="20" class="sans" font-size="11.5" font-weight="600" fill="#0f172a">Continuous Growth</text>
    <text x="10" y="36" class="sans" font-size="9.5" fill="#475569">Iterative experimentation</text>
    <text x="10" y="48" class="sans" font-size="9.5" fill="#475569">&amp; hands-on learning.</text>
  </g>

</svg>