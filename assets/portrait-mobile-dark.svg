<svg xmlns="http://www.w3.org/2000/svg" width="640" height="680" viewBox="0 0 640 680" role="img" aria-labelledby="title">
  <title id="title">Console ASCII Portrait</title>
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#0d1326"/>
    </linearGradient>
    
    <linearGradient id="ascii-signal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22D3EE">
        <animate attributeName="stop-color" values="#22D3EE;#7C3AED;#38BDF8;#22D3EE" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#7C3AED">
        <animate attributeName="stop-color" values="#7C3AED;#38BDF8;#22D3EE;#7C3AED" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    
    <linearGradient id="border-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="50%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    
    <linearGradient id="scan-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="50%" stop-color="#22D3EE" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </linearGradient>
    
    <radialGradient id="portrait-halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.18"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    
    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#22D3EE" opacity="0.045"/>
    </pattern>
    
    <pattern id="portrait-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 H 0 V 40" fill="none" stroke="#38BDF8" stroke-width="0.5" opacity="0.09"/>
      <circle cx="0" cy="0" r="1" fill="#22D3EE" opacity="0.1350"/>
    </pattern>
    
    <clipPath id="panel-clip">
      <rect x="20" y="50" width="600" height="610" rx="12"/>
    </clipPath>
    
    <mask id="portrait-reveal">
      <rect x="20" y="50" width="600" height="0" rx="12" fill="white">
        <animate attributeName="height" from="0" to="610" dur="1.8s" begin="0.1s" fill="freeze"/>
      </rect>
    </mask>

    <style>
      .mono { font-family: 'Courier New', Consolas, 'Fira Code', monospace; }
      .ascii-text { 
        font-family: 'Courier New', Consolas, 'Liberation Mono', monospace; 
        font-size: 7.2px; 
        letter-spacing: -0.1px; 
        fill: url(#ascii-signal); 
      }
      .term-text { font-family: 'Courier New', Consolas, monospace; font-size: 11px; fill: #64748B; letter-spacing: 1px; }
      .live-badge { font-family: 'Courier New', Consolas, monospace; font-size: 9px; fill: #EF4444; letter-spacing: 1.5px; font-weight: bold; }
      .tag-badge { font-family: 'Courier New', Consolas, monospace; font-size: 9px; fill: #22D3EE; opacity: 0.8; letter-spacing: 1px; }
    </style>
  </defs>

  <!-- Outer Console Background -->
  <rect width="640" height="680" rx="16" fill="url(#bg-grad)"/>
  <rect width="640" height="680" rx="16" fill="url(#scanlines)"/>
  
  <!-- Terminal Top Bar -->
  <rect x="3" y="3" width="634" height="36" rx="14" fill="#07111f" fill-opacity="0.85"/>
  <circle cx="20" cy="21" r="5" fill="#EF4444"/>
  <circle cx="36" cy="21" r="5" fill="#F59E0B"/>
  <circle cx="52" cy="21" r="5" fill="#10B981"/>
  
  <text x="320.0" y="24" text-anchor="middle" class="term-text">PORTRAIT // OPTICAL_SCANNER_v1.0</text>
  
  <circle cx="554" cy="21" r="3.5" fill="#EF4444">
    <animate attributeName="opacity" values="1;0.2;1" dur="1s" repeatCount="indefinite"/>
  </circle>
  <text x="564" y="24" class="live-badge">SCANNING</text>

  <!-- Visual Panel Container -->
  <rect x="20" y="50" width="600" height="610" rx="12" fill="#07111f" fill-opacity="0.4" stroke="url(#border-grad)" stroke-opacity="0.45"/>
  
  <!-- Background Grid and Halo inside Panel -->
  <g clip-path="url(#panel-clip)">
    <rect x="20" y="50" width="600" height="610" fill="url(#portrait-grid)"/>
    <ellipse cx="320.0" cy="355.0" rx="252.0" ry="268.4" fill="url(#portrait-halo)"/>
    
    <!-- Reticle Circles and Tech Crosshairs -->
    <circle cx="320.0" cy="355.0" r="231.8" fill="none" stroke="#22D3EE" stroke-width="0.8" stroke-dasharray="6 8" opacity="0.15">
      <animateTransform attributeName="transform" type="rotate" from="0 320.0 355.0" to="360 320.0 355.0" dur="30s" repeatCount="indefinite"/>
    </circle>
    <circle cx="320.0" cy="355.0" r="158.6" fill="none" stroke="#7C3AED" stroke-width="0.6" stroke-dasharray="4 6" opacity="0.15">
      <animateTransform attributeName="transform" type="rotate" from="360 320.0 355.0" to="0 320.0 355.0" dur="20s" repeatCount="indefinite"/>
    </circle>
    
    <!-- Corner HUD markers -->
    <path d="M 36 78 V 66 H 48" fill="none" stroke="#22D3EE" stroke-width="1.5" opacity="0.6"/>
    <path d="M 604 78 V 66 H 592" fill="none" stroke="#22D3EE" stroke-width="1.5" opacity="0.6"/>
    <path d="M 36 632 V 644 H 48" fill="none" stroke="#22D3EE" stroke-width="1.5" opacity="0.6"/>
    <path d="M 604 632 V 644 H 592" fill="none" stroke="#22D3EE" stroke-width="1.5" opacity="0.6"/>

    <text x="44" y="642" class="tag-badge">SYS.RES: 74x74 // MATRIX.RENDER</text>
    <text x="596" y="642" text-anchor="end" class="tag-badge">SIG: LOCKED [100%]</text>
  </g>

