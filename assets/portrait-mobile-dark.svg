  <!-- Sweeping Laser Scan Line -->
  <rect x="20" y="-10" width="600" height="60" fill="url(#scan-grad)" opacity="0.8" style="mix-blend-mode:screen" clip-path="url(#panel-clip)">
    <animateTransform attributeName="transform" type="translate" from="0 0" to="0 690" dur="3.8s" repeatCount="indefinite"/>
  </rect>

  <!-- Glowing Outer Frame Border -->
  <rect x="2" y="2" width="636" height="676" rx="15" fill="none" stroke="url(#border-grad)" stroke-width="1.8" opacity="0.8">
    <animate attributeName="opacity" values="0.5;0.95;0.5" dur="3s" repeatCount="indefinite"/>
  </rect>
</svg>