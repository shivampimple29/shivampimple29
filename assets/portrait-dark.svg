  </g>

  <!-- Synchronized Sweeping Optical Laser Scanner & Glow -->
  <g clip-path="url(#panel-clip)">
    <rect x="20" y="0" width="810" height="70" fill="url(#scan-grad)" opacity="0.85" style="mix-blend-mode:screen">
      <animateTransform attributeName="transform" type="translate" values="0 -20; 0 510; 0 510; 0 -20; 0 -20" keyTimes="0;0.68;0.90;0.96;1" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.85;0.85;0;0;0.85" keyTimes="0;0.68;0.75;0.98;1" dur="4s" repeatCount="indefinite"/>
    </rect>
    <line x1="20" y1="0" x2="830" y2="0" stroke="#22D3EE" stroke-width="2" opacity="0.95">
      <animateTransform attributeName="transform" type="translate" values="0 50; 0 520; 0 520; 0 50; 0 50" keyTimes="0;0.68;0.90;0.96;1" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.95;0.95;0;0;0.95" keyTimes="0;0.68;0.75;0.98;1" dur="4s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- Glowing Outer Frame Border -->
  <rect x="2" y="2" width="846" height="536" rx="15" fill="none" stroke="url(#border-grad)" stroke-width="1.8" opacity="0.8">
    <animate attributeName="opacity" values="0.5;0.95;0.5" dur="3s" repeatCount="indefinite"/>
  </rect>
</svg>